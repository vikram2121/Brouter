[build]
buildCommand = "npm install && rm -rf dist && npm run build && cd client && npm install && npm run build"

[deploy]
startCommand = "node -e \"const s=process.env.SERVICE; require('./dist/'+(s==='worker'?'worker':s==='oracle'?'oracle':'index')+'.js')\""
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
